# Local development stack with bundled Postgres
# Usage:
#   docker-compose -f docker-compose.local.yml up -d
#   docker-compose -f docker-compose.local.yml exec fraudshield-api python setup_database.py

services:
  fraudshield-api:
    build: .
    container_name: fraudshield-api-local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.0-flash-exp}
      - GEMINI_EMBED_MODEL_NAME=${GEMINI_EMBED_MODEL_NAME:-models/embedding-gecko-001}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=postgresql://demo_user:demo_password@postgres:5432/fraudshield_demo
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/data/uploads}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    extra_hosts:
      - "postgres:host-gateway"
    networks:
      - fraudshield-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/bank/list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: fraudshield-db-local
    environment:
      - POSTGRES_DB=fraudshield_demo
      - POSTGRES_USER=demo_user
      - POSTGRES_PASSWORD=demo_password
    ports:
      - "5433:5432"  # Expose to host on localhost:5433 (avoids conflict with local PostgreSQL)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraudshield-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d fraudshield_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fraudshield-local:
    driver: bridge

volumes:
  postgres_data:
